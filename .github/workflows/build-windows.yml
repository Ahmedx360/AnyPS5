name: Build AnyPS5 (Windows)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and Setup WinLibs GCC 15.2.0
        shell: powershell
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-19.1.1-12.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-15.2.0-llvm-19.1.1-mingw-w64ucrt-r1.zip"
          Write-Host "Downloading WinLibs GCC 15.2.0..."
          Invoke-WebRequest -Uri $url -OutFile "winlibs.zip"
          Write-Host "Extracting WinLibs..."
          Expand-Archive -Path "winlibs.zip" -DestinationPath "C:\winlibs"
          echo "C:\winlibs\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="C:/winlibs/mingw64/bin/gcc.exe" -DCMAKE_CXX_COMPILER="C:/winlibs/mingw64/bin/g++.exe"

      - name: Build AnyPS5
        shell: cmd
        run: cmake --build build --config Release

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyPS5-Windows-Relinker
          path: |
            build/tools/relinker.exe
            build/**/*.dll
          if-no-files-found: warn
